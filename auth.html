<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Google - e-Ticket Kawak Diginus</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#111827}
    .card{width:min(92vw,430px);background:#fff;border-radius:18px;padding:30px;box-shadow:0 14px 45px rgba(15,23,42,.10);text-align:center}
    .icon{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:#111827;color:#fff;font-size:28px}
    h1{font-size:22px;margin:0 0 8px}
    p{color:#6b7280;line-height:1.55;font-size:14px}
    #google-button{display:flex;justify-content:center;margin-top:22px;min-height:44px}
    .status{margin-top:16px;padding:12px;border-radius:10px;background:#f8fafc;color:#6b7280;font-size:13px;line-height:1.5}
    .error{background:#fef2f2;color:#b91c1c}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h1>Login e-Ticket</h1>
    <p>Gunakan akun Google yang sudah didaftarkan dan disetujui oleh ADMIN.</p>
    <div id="google-button"></div>
    <div id="status" class="status">Menyiapkan login Google...</div>
  </div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('client_id') || '';
  var statusEl = document.getElementById('status');

  function status(text, error){
    statusEl.textContent = text;
    statusEl.className = error ? 'status error' : 'status';
  }

  function init(){
    if(!clientId){
      status('Client ID aplikasi tidak ditemukan.', true);
      return;
    }

    if(!window.google || !google.accounts || !google.accounts.id){
      setTimeout(init, 150);
      return;
    }

    google.accounts.id.initialize({
      client_id: clientId,
      callback: function(response){
        if(!response || !response.credential){
          status('Login Google gagal: token tidak diterima.', true);
          return;
        }

        status('Login berhasil. Mengirim identitas ke aplikasi...');

        if(!window.opener){
          status('Jendela aplikasi utama tidak ditemukan. Tutup halaman ini dan buka login dari aplikasi.', true);
          return;
        }

        window.opener.postMessage({
          type: 'ETICKET_GOOGLE_AUTH',
          credential: response.credential
        }, '*');

        setTimeout(function(){
          try { window.close(); } catch(e) {}
        }, 500);
      }
    });

    google.accounts.id.renderButton(
      document.getElementById('google-button'),
      {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        text: 'signin_with',
        shape: 'rectangular',
        logo_alignment: 'left',
        width: 300
      }
    );

    status('Silakan pilih akun Google.');
  }

  init();
})();
</script>
</body>
</html>
